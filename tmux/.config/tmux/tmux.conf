# Circadia (light) - https://github.com/tanmaymanojgandhi/circadia
set -g status-style fg=#46535f,bg=#ece4d4
set -g window-status-current-style fg=#f4eee1,bg=#195697
set -g pane-border-style fg=#d4c8b2
set -g pane-active-border-style fg=#195697
set -g message-style fg=#28323a,bg=#e2d8c3
