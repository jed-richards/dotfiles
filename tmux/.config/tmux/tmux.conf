set -ga terminal-overrides ",tmux-256color:RGB"
set-option -g default-terminal "tmux-256color"
set -s escape-time 0
set-option -g focus-events on
set -g history-limit 50000
set -g mouse on

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g base-index 1

bind r source-file ~/.config/tmux/tmux.conf

# vim keys
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind-key -r f run-shell "tmux neww tmux-sessionizer"
bind-key -N "Create or attach to lazygit window" -r g new-window -S -n "lazygit" "lazygit"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'

## Colorscheme - https://github.com/tanmaymanojgandhi/circadia
# Tracked here for `prefix + U` updates, but sourced explicitly below:
# TPM only auto-sources a *.tmux file at a plugin's root, and circadia's
# tmux entrypoint lives at ports/tmux/circadia.tmux, so TPM never finds it.
set -g @plugin 'tanmaymanojgandhi/circadia'
set -g @circadia_flavour 'dark-ember' # Options: light-parchment, dark-ember, dark-plum, dark-forest
run 'bash ~/.config/tmux/plugins/circadia/ports/tmux/circadia.tmux'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
